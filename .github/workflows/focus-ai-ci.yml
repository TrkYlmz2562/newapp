name: Focus AI CI

on:
  push:
    branches: ['**']
    paths:
      - 'focus-ai/**'
      - '.github/workflows/focus-ai-ci.yml'
  pull_request:
    paths:
      - 'focus-ai/**'
      - '.github/workflows/focus-ai-ci.yml'
  workflow_dispatch:

concurrency:
  group: focus-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-ai/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('focus-ai/backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build --verbosity normal

  migrations:
    name: Backend — migrations apply to Postgres + pgvector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-ai/backend

    services:
      postgres:
        # Must be the pgvector image: the schema declares vector(1536) columns
        # and the migration creates the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: focusai
          POSTGRES_PASSWORD: focusai
          POSTGRES_DB: focusai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet tool install --global dotnet-ef --version 9.0.18

      - name: Apply migrations
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=focusai;Username=focusai;Password=focusai
          Jwt__SigningKey: ci-only-signing-key-not-a-secret-32-bytes-long
        run: |
          dotnet ef database update \
            --project src/FocusAI.Infrastructure \
            --startup-project src/FocusAI.Api

      - name: Fail if the model has drifted from the migrations
        env:
          SkipDatabaseInitialization: 'true'
          Jwt__SigningKey: ci-only-signing-key-not-a-secret-32-bytes-long
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/FocusAI.Infrastructure \
            --startup-project src/FocusAI.Api

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-ai/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: focus-ai/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: focus-ai/backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: focus-ai/frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
