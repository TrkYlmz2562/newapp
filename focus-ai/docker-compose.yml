# Focus AI — full local stack.
#
#   docker compose up --build
#
# Works with zero API keys: the backend falls back to local hashing embeddings
# and extractive summaries, so the pipeline still ingests, clusters, scores and
# publishes real stories. Add an LLM provider under `Llm` to get the AI summary
# and analysis layers described in PRD sections 5.2 and 5.5.

name: focus-ai

services:
  postgres:
    # pgvector is not optional — the schema declares vector(1536) columns.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: focusai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focusai}
      POSTGRES_DB: focusai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focusai -d focusai']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-focusai-dev-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Kendi bilgisayarında çalışan çeviri modeli. VARSAYILAN OLARAK KAPALI —
  # ~2 GB RAM ve ilk açılışta ~1,1 GB'lık bir indirme demek. Açmak için:
  #
  #   docker compose --profile translate up -d
  #   # ve .env içine:  TRANSLATION_ENABLED=true
  #
  # Ne işe yarıyor: LLM yapılandırılmadığında (ya da Gemini düştüğünde) boru
  # hattı, makalenin kendi cümlelerini çıkarıp yayınlıyor. İngilizce bir kaynakta
  # bu, Türkçe okura İngilizce kart demek. Bu servis o yolu Türkçeleştiriyor.
  # LLM özet katmanının yerine GEÇMEZ: özet yazmak editöryal bir iş, Türkçe onun
  # yan ürünü — çevirmen bunların hiçbirini yapamaz.
  #
  # Neden bu model: LibreTranslate'in en-tr motoru Kasım 2021 tarihli ~65M
  # parametrelik bir Argos paketi ve ölçtüğümüzde "React 20 ships" ifadesini
  # "20 gemi", "bug" kelimesini "boğa" diye çeviriyor. Teknoloji haberinde bu,
  # İngilizce bırakmaktan kötü. Hy-MT2 (Apache-2.0) ürün adlarını, sürüm
  # numaralarını ve CVE kimliklerini olduğu gibi koruyor.
  #
  # 32 GB RAM veya >=6 GB VRAM'li bir GPU varsa Hy-MT2-7B'ye geçmek belirgin bir
  # kalite sıçraması; tek değişen aşağıdaki dosya adı.
  translator:
    profiles: ['translate']
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - '-hf'
      - '${TRANSLATION_MODEL_REPO:-tencent/Hunyuan-MT2-1.8B-GGUF:Q4_K_M}'
      - '--host'
      - '0.0.0.0'
      - '--port'
      - '8080'
      - '--ctx-size'
      - '4096'
      # Sıra derinliği 1: enrichment tek işçi, paralel istek gelmiyor. Fazlası
      # sadece RAM yer.
      - '--parallel'
      - '1'
    volumes:
      # Model önbelleği. Bu olmadan her yeniden başlatma ~1,1 GB indiriyor.
      - translator-models:/root/.cache/llama.cpp
    ports:
      - '8081:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health || exit 1']
      # İlk açılış modeli indirip yüklüyor; start_period bu yüzden uzun.
      start_period: 600s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=focusai;Username=focusai;Password=${POSTGRES_PASSWORD:-focusai}
      ConnectionStrings__Redis: redis:6379
      # Override in any real deployment. Must be at least 32 bytes or the API
      # refuses to start rather than issuing forgeable tokens.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-focus-ai-local-development-signing-key-change-me-32b}
      Cors__Origins__0: http://localhost:3000
      # Telefondan/LAN'dan erişim için PC'nin adresini .env'de ver:
      #   EXTRA_CORS_ORIGIN=http://192.168.1.50:3000
      Cors__Origins__1: ${EXTRA_CORS_ORIGIN:-}
      Search__Url: http://meilisearch:7700
      Search__ApiKey: ${MEILI_MASTER_KEY:-focusai-dev-master-key}
      Ingestion__EnableBackgroundJobs: 'true'
      # Point these at a provider to enable AI summaries and analysis:
      #   Llm__Provider: OpenAI
      #   Llm__Providers__OpenAI__ApiKey: sk-...
      #   Embeddings__Provider: OpenAI
      #   Embeddings__ApiKey: sk-...
      Llm__Provider: ${LLM_PROVIDER:-Disabled}
      Llm__Providers__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Llm__Providers__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Llm__Providers__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Sürüm SABİTLENMİŞ olmalı, "-latest" takma adı DEĞİL. Google takma adları
      # her yeni sürümde sessizce yeni modele bağlıyor ve fiyatın değişebileceğini
      # kendisi yazıyor: 3.5 Flash-Lite, 2.5 Flash-Lite'ın 3 katı girdi / 6,25 katı
      # çıktı fiyatına sahip. Yani takma ad kullanmak, birim maliyetin bir gecede
      # dörde katlanmasına açık kapı bırakır.
      # NOT: gemini-2.5-FLASH (lite olmayan) yeni hesaplara kapatıldı ve 404 döner;
      # gemini-2.5-flash-lite açıktır. Anahtarının desteklediklerini görmek için:
      #   curl "https://generativelanguage.googleapis.com/v1beta/models?key=ANAHTAR"
      Llm__Providers__Gemini__Model: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      Llm__Providers__OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-Disabled}
      Embeddings__ApiKey: ${EMBEDDINGS_API_KEY:-${OPENAI_API_KEY:-}}
      # Yukarıdaki `translator` servisi ile birlikte açılır. Kapalıyken boru hattı
      # aynen eskisi gibi çalışır, sadece LLM'siz yolda kaynak dilinde yayınlar.
      Translation__Enabled: ${TRANSLATION_ENABLED:-false}
      Translation__BaseUrl: http://translator:8080/v1/
    ports:
      - '5210:8080'
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # Build-time, not run-time: see frontend/Dockerfile.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5210}
    depends_on:
      - api
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  meili-data:
  translator-models:
